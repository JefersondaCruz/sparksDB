[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sparksdb"
version = "0.1.0"
description = "Cliente Postgres desktop basico - conectar, navegar schemas e rodar SQL"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
  "pywebview>=6",
  "psycopg[binary]>=3.3",
  "psycopg-pool>=3.2",
  "keyring>=25",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["sparksdb"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# O keyring carrega o backend libsecret via gi do sistema, que emite avisos de depreciacao.
filterwarnings = ["ignore::DeprecationWarning:gi.*"]
