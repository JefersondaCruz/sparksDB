name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SPARKSDB_TEST_DSN: host=localhost port=5432 dbname=postgres user=postgres password=postgres
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: npm ci
      - run: npm run build:vite

      - run: pip install -e "backend[dev]"
      - run: python -m pytest backend -v

      - run: PYTHON=python scripts/build-appimage.sh
      - uses: actions/upload-artifact@v4
        with:
          name: sparksdb-appimage
          path: build/*.AppImage
